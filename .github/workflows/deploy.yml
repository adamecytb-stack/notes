name: Deploy Nocturne

# Deploys from GitHub so no computer is needed. Runs on every push, and can be
# started by hand from the Actions tab.
on:
  push:
    branches:
      - main
      - claude/dream-journal-ios-vd6maf
  workflow_dispatch:

concurrency:
  group: deploy-nocturne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Playwright is only used by the local test scripts; CI must not spend
      # two minutes downloading browsers it will never launch.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Secrets are always passed through env, never interpolated into the
      # script itself, so an awkward character in a passphrase cannot break
      # (or rewrite) the command being run.
      - name: Check the secrets are set
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SETUP_CODE" ]            || missing="$missing SETUP_CODE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Find or create the database
        id: db
        # Talks to the REST API rather than parsing `wrangler d1 list`: wrangler
        # prints a banner alongside its JSON, and its failure was previously
        # indistinguishable from "no database yet" — a missing D1 permission
        # got reported as a successful lookup returning nothing.
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          reason() { jq -r '[.errors[]?.message] | join("; ") // "unknown error"' <<<"$1"; }

          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?name=dreams")"
          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
            echo "::error::Cloudflare refused the database lookup: $(reason "$resp")"
            echo "The API token is probably missing the Account -> D1 -> Edit permission."
            echo "Edit it at https://dash.cloudflare.com/profile/api-tokens and re-run."
            exit 1
          fi

          DB_ID="$(jq -r '.result[]? | select(.name=="dreams") | .uuid' <<<"$resp" | head -1)"

          if [ -z "$DB_ID" ]; then
            echo "No 'dreams' database yet — creating it."
            created="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' --data '{"name":"dreams"}' "$API")"
            if [ "$(jq -r '.success' <<<"$created")" != "true" ]; then
              echo "::error::Could not create the database: $(reason "$created")"
              exit 1
            fi
            DB_ID="$(jq -r '.result.uuid' <<<"$created")"
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Could not determine the database id."
            exit 1
          fi
          echo "Using database $DB_ID"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Point wrangler.toml at it
        env:
          DB_ID: ${{ steps.db.outputs.id }}
        run: |
          set -euo pipefail
          # Only rewrites the placeholder, so a real id committed later is kept.
          sed -i "s|PASTE_YOUR_DATABASE_ID_HERE|$DB_ID|" wrangler.toml
          if grep -q 'PASTE_YOUR_DATABASE_ID_HERE' wrangler.toml; then
            echo "::error::Failed to substitute the database id."
            exit 1
          fi

      - name: Create the tables
        # schema.sql is CREATE TABLE IF NOT EXISTS throughout, so this is safe
        # to run on every deploy and never touches existing rows.
        run: npx wrangler d1 execute dreams --remote --file=./schema.sql

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"

      - name: Set the setup code
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE

      - name: Set the Gemini key, if there is one
        # Optional: without it the app works exactly as before, minus the
        # dream companion. Removing the repo secret does not remove the
        # Worker secret — delete that with `wrangler secret delete`.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
            echo "Dream companion enabled."
          else
            echo "No GEMINI_API_KEY secret — skipping the dream companion."
          fi

      - name: Set the salt pepper once, and never again
        # This value must stay stable for the lifetime of the journal, so it is
        # generated here only if the Worker does not already have one.
        run: |
          set -uo pipefail
          have="$(npx wrangler secret list 2>/dev/null || true)"
          if printf '%s' "$have" | grep -q 'SALT_PEPPER'; then
            echo "SALT_PEPPER already set — leaving it alone."
          else
            echo "Generating SALT_PEPPER."
            openssl rand -hex 32 | npx wrangler secret put SALT_PEPPER
          fi

      - name: Summary
        run: |
          {
            echo "## Nocturne is live"
            echo
            if [ -n "${DEPLOY_URL:-}" ]; then
              echo "### $DEPLOY_URL"
            else
              echo "Deployed — find the URL in the Cloudflare dashboard."
            fi
            echo
            echo "1. Open that link in **Safari** on your iPhone."
            echo "2. Tap *First time here? Create your account*."
            echo "3. Enter a name, a passphrase, and your setup code."
            echo "4. Share -> **Add to Home Screen**."
            echo
            echo "Send the same link and setup code to your friend."
            echo "After the second account, sign-up closes for good."
          } >> "$GITHUB_STEP_SUMMARY"
