name: Deploy Nocturne

# Deploys from GitHub so no computer is needed. Runs on every push, and can be
# started by hand from the Actions tab.
on:
  push:
    branches:
      - main
      - claude/dream-journal-ios-vd6maf
  workflow_dispatch:

concurrency:
  group: deploy-nocturne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Playwright is only used by the local test scripts; CI must not spend
      # two minutes downloading browsers it will never launch.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Secrets are always passed through env, never interpolated into the
      # script itself, so an awkward character in a passphrase cannot break
      # (or rewrite) the command being run.
      - name: Check the secrets are set
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SETUP_CODE" ]            || missing="$missing SETUP_CODE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Find or create the database
        id: db
        run: |
          set -euo pipefail
          find_id() {
            npx wrangler d1 list --json 2>/dev/null \
              | jq -r '.[]? | select(.name=="dreams") | (.uuid // .database_id // .id)' \
              | head -1
          }
          DB_ID="$(find_id || true)"
          if [ -z "$DB_ID" ]; then
            echo "No 'dreams' database yet — creating it."
            npx wrangler d1 create dreams
            DB_ID="$(find_id || true)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not find or create the D1 database."
            exit 1
          fi
          echo "Using database $DB_ID"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Point wrangler.toml at it
        env:
          DB_ID: ${{ steps.db.outputs.id }}
        run: |
          set -euo pipefail
          # Only rewrites the placeholder, so a real id committed later is kept.
          sed -i "s|PASTE_YOUR_DATABASE_ID_HERE|$DB_ID|" wrangler.toml
          if grep -q 'PASTE_YOUR_DATABASE_ID_HERE' wrangler.toml; then
            echo "::error::Failed to substitute the database id."
            exit 1
          fi

      - name: Create the tables
        # schema.sql is CREATE TABLE IF NOT EXISTS throughout, so this is safe
        # to run on every deploy and never touches existing rows.
        run: npx wrangler d1 execute dreams --remote --file=./schema.sql

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"

      - name: Set the setup code
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE

      - name: Set the salt pepper once, and never again
        # This value must stay stable for the lifetime of the journal, so it is
        # generated here only if the Worker does not already have one.
        run: |
          set -uo pipefail
          have="$(npx wrangler secret list 2>/dev/null || true)"
          if printf '%s' "$have" | grep -q 'SALT_PEPPER'; then
            echo "SALT_PEPPER already set — leaving it alone."
          else
            echo "Generating SALT_PEPPER."
            openssl rand -hex 32 | npx wrangler secret put SALT_PEPPER
          fi

      - name: Summary
        run: |
          {
            echo "## Nocturne is live"
            echo
            if [ -n "${DEPLOY_URL:-}" ]; then
              echo "### $DEPLOY_URL"
            else
              echo "Deployed — find the URL in the Cloudflare dashboard."
            fi
            echo
            echo "1. Open that link in **Safari** on your iPhone."
            echo "2. Tap *First time here? Create your account*."
            echo "3. Enter a name, a passphrase, and your setup code."
            echo "4. Share -> **Add to Home Screen**."
            echo
            echo "Send the same link and setup code to your friend."
            echo "After the second account, sign-up closes for good."
          } >> "$GITHUB_STEP_SUMMARY"
